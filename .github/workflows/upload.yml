name: Daily Birds Video

on:
  schedule:
    - cron: '0 0 * * *'    # Subah 5:00 baje Pakistan
    - cron: '30 0 * * *'   # Subah 5:30 baje Pakistan - Backup
  workflow_dispatch:

jobs:
  make-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install FFmpeg + Libraries
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests google-api-python-client google-auth-oauthlib
      - name: Create token.json from Secrets
        run: |
          echo '{"token":"","refresh_token":"${{ secrets.YOUTUBE_REFRESH_TOKEN }}","token_uri":"https://oauth2.googleapis.com/token","client_id":"${{ secrets.YOUTUBE_CLIENT_ID }}","client_secret":"${{ secrets.YOUTUBE_CLIENT_SECRET }}","scopes":["https://www.googleapis.com/auth/youtube.upload"],"expiry":"2026-01-01T00:00:00Z"}' > token.json
      - name: Run Main
        run: python main.py
      - name: Save State
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add state.json
          git commit -m "update state" || true
          git push || true
